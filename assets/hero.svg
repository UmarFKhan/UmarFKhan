<svg width="1200" height="420" viewBox="0 0 1200 420" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Umar Khan — builder, founder, and computer science student</title>
  <desc id="desc">Animated cyber-style banner with moving circuitry, orbiting nodes, and a terminal interface.</desc>

  <defs>
    <linearGradient id="bg" x1="28" y1="18" x2="1170" y2="410" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset="0.48" stop-color="#0B1023"/>
      <stop offset="1" stop-color="#07131B"/>
    </linearGradient>
    <linearGradient id="edge" x1="60" y1="30" x2="1140" y2="390" gradientUnits="userSpaceOnUse">
      <stop stop-color="#7C3AED"/>
      <stop offset="0.48" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <linearGradient id="text" x1="174" y1="122" x2="730" y2="245" gradientUnits="userSpaceOnUse">
      <stop stop-color="#F8FAFC"/>
      <stop offset="0.5" stop-color="#C4B5FD"/>
      <stop offset="1" stop-color="#67E8F9"/>
    </linearGradient>
    <radialGradient id="orb" cx="0" cy="0" r="1" gradientTransform="translate(976 210) rotate(90) scale(132)" gradientUnits="userSpaceOnUse">
      <stop stop-color="#22D3EE" stop-opacity="0.17"/>
      <stop offset="0.6" stop-color="#7C3AED" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#020617" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="34" height="34" patternUnits="userSpaceOnUse">
      <path d="M34 0H0V34" stroke="#8B5CF6" stroke-opacity="0.08"/>
    </pattern>
    <filter id="glow" x="-80%" y="-80%" width="260%" height="260%">
      <feGaussianBlur stdDeviation="5" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="softGlow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="18"/>
    </filter>
    <clipPath id="screenClip"><rect x="74" y="286" width="690" height="78" rx="12"/></clipPath>
  </defs>

  <rect width="1200" height="420" rx="28" fill="url(#bg)"/>
  <rect width="1200" height="420" rx="28" fill="url(#grid)"/>
  <rect x="1.5" y="1.5" width="1197" height="417" rx="26.5" stroke="url(#edge)" stroke-width="3" stroke-opacity="0.62"/>

  <g opacity="0.45">
    <path d="M0 78H132L166 112H310" stroke="#22D3EE" stroke-width="1.5" stroke-dasharray="8 10">
      <animate attributeName="stroke-dashoffset" values="0;-72" dur="4s" repeatCount="indefinite"/>
    </path>
    <path d="M1200 336H1095L1057 298H862" stroke="#8B5CF6" stroke-width="1.5" stroke-dasharray="7 12">
      <animate attributeName="stroke-dashoffset" values="0;76" dur="5s" repeatCount="indefinite"/>
    </path>
    <path d="M408 0V38L438 68H568" stroke="#34D399" stroke-width="1.2" stroke-dasharray="5 9">
      <animate attributeName="stroke-dashoffset" values="0;-56" dur="3.2s" repeatCount="indefinite"/>
    </path>
  </g>

  <g fill="#22D3EE">
    <circle cx="126" cy="78" r="3"><animate attributeName="opacity" values=".25;1;.25" dur="2s" repeatCount="indefinite"/></circle>
    <circle cx="309" cy="112" r="3"><animate attributeName="opacity" values="1;.2;1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="864" cy="298" r="3" fill="#8B5CF6"><animate attributeName="r" values="2;5;2" dur="2.3s" repeatCount="indefinite"/></circle>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <g transform="translate(74 64)">
      <rect width="162" height="32" rx="16" fill="#111831" stroke="#7C3AED" stroke-opacity="0.75"/>
      <circle cx="20" cy="16" r="5" fill="#34D399" filter="url(#glow)">
        <animate attributeName="opacity" values="1;.35;1" dur="1.8s" repeatCount="indefinite"/>
      </circle>
      <text x="34" y="21" fill="#CBD5E1" font-size="13" font-weight="700" letter-spacing="1.2">OPEN TO BUILD</text>
    </g>

    <text x="72" y="163" fill="#94A3B8" font-size="22" font-weight="600" letter-spacing="5">HELLO WORLD, I'M</text>
    <text x="68" y="232" fill="url(#text)" font-size="72" font-weight="800" letter-spacing="-2">UMAR KHAN</text>
    <text x="74" y="270" fill="#A5B4FC" font-size="19" font-weight="600" letter-spacing="1.2">FOUNDER  /  AI BUILDER  /  EMBEDDED SYSTEMS</text>
  </g>

  <g clip-path="url(#screenClip)">
    <rect x="74" y="286" width="690" height="78" rx="12" fill="#050816" stroke="#263453"/>
    <rect x="74" y="286" width="690" height="24" fill="#10172B"/>
    <circle cx="91" cy="298" r="4" fill="#FB7185"/>
    <circle cx="105" cy="298" r="4" fill="#FBBF24"/>
    <circle cx="119" cy="298" r="4" fill="#34D399"/>
    <text x="140" y="302" fill="#64748B" font-family="Consolas, monospace" font-size="10">umar@atechabad:~/build</text>
    <text x="92" y="340" fill="#34D399" font-family="Consolas, monospace" font-size="15">❯</text>
    <text x="114" y="340" fill="#D8B4FE" font-family="Consolas, monospace" font-size="15">turn_ideas_into</text>
    <text x="252" y="340" fill="#E2E8F0" font-family="Consolas, monospace" font-size="15">(</text>
    <text x="262" y="340" fill="#67E8F9" font-family="Consolas, monospace" font-size="15">"shipped software"</text>
    <text x="421" y="340" fill="#E2E8F0" font-family="Consolas, monospace" font-size="15">);</text>
    <rect x="444" y="326" width="9" height="18" fill="#67E8F9">
      <animate attributeName="opacity" values="1;1;0;0;1" keyTimes="0;.45;.5;.95;1" dur="1.1s" repeatCount="indefinite"/>
    </rect>
    <rect x="74" y="309" width="690" height="2" fill="#22D3EE" opacity="0.12">
      <animate attributeName="y" values="309;362;309" dur="4.5s" repeatCount="indefinite"/>
    </rect>
  </g>

  <g transform="translate(976 210)">
    <circle r="150" fill="url(#orb)" filter="url(#softGlow)"/>
    <circle r="112" stroke="#22D3EE" stroke-opacity="0.32" stroke-width="1.5" stroke-dasharray="3 11">
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="18s" repeatCount="indefinite"/>
    </circle>
    <circle r="78" stroke="#8B5CF6" stroke-opacity="0.5" stroke-width="1.5" stroke-dasharray="18 9">
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="12s" repeatCount="indefinite"/>
    </circle>
    <circle r="48" fill="#0B1630" stroke="#67E8F9" stroke-width="2" stroke-opacity="0.7"/>
    <path d="M-20 9L-7 22L23-20" stroke="#34D399" stroke-width="7" stroke-linecap="round" stroke-linejoin="round" filter="url(#glow)"/>
    <text x="0" y="72" text-anchor="middle" fill="#94A3B8" font-family="Consolas, monospace" font-size="11" letter-spacing="2">BUILD // SHIP // REPEAT</text>

    <g>
      <circle cx="0" cy="-112" r="6" fill="#22D3EE" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="0" to="360" dur="7s" repeatCount="indefinite"/>
    </g>
    <g>
      <circle cx="0" cy="78" r="5" fill="#A78BFA" filter="url(#glow)"/>
      <animateTransform attributeName="transform" type="rotate" from="360" to="0" dur="5s" repeatCount="indefinite"/>
    </g>
  </g>

  <g fill="#E2E8F0">
    <circle cx="827" cy="88" r="1.5"><animate attributeName="opacity" values=".15;.9;.15" dur="2.2s" repeatCount="indefinite"/></circle>
    <circle cx="1112" cy="82" r="1"><animate attributeName="opacity" values=".8;.1;.8" dur="3.4s" repeatCount="indefinite"/></circle>
    <circle cx="798" cy="205" r="1"><animate attributeName="opacity" values=".1;1;.1" dur="2.8s" repeatCount="indefinite"/></circle>
    <circle cx="1137" cy="229" r="1.5"><animate attributeName="opacity" values="1;.2;1" dur="2.6s" repeatCount="indefinite"/></circle>
    <circle cx="824" cy="352" r="1"><animate attributeName="opacity" values=".2;.8;.2" dur="3.2s" repeatCount="indefinite"/></circle>
    <circle cx="1088" cy="363" r="1.5"><animate attributeName="opacity" values=".9;.15;.9" dur="2.4s" repeatCount="indefinite"/></circle>
  </g>
</svg>
