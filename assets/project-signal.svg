<svg width="1200" height="160" viewBox="0 0 1200 160" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Umar Khan's project signal map</title>
  <desc id="desc">Animated network linking AI, IoT, web, GPU, data structures, and education projects.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="160" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/><stop offset=".5" stop-color="#10152A"/><stop offset="1" stop-color="#07131B"/>
    </linearGradient>
    <linearGradient id="signal" x1="100" y1="80" x2="1100" y2="80" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="160" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="158" rx="19" stroke="#334155" stroke-opacity=".75"/>

  <g stroke="url(#signal)" stroke-width="2" stroke-linecap="round" stroke-dasharray="7 11" opacity=".7">
    <path d="M600 80L118 46"><animate attributeName="stroke-dashoffset" values="0;-72" dur="3s" repeatCount="indefinite"/></path>
    <path d="M600 80L285 116"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.7s" repeatCount="indefinite"/></path>
    <path d="M600 80L446 42"><animate attributeName="stroke-dashoffset" values="0;-72" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M600 80L754 42"><animate attributeName="stroke-dashoffset" values="0;72" dur="2.4s" repeatCount="indefinite"/></path>
    <path d="M600 80L915 116"><animate attributeName="stroke-dashoffset" values="0;72" dur="2.7s" repeatCount="indefinite"/></path>
    <path d="M600 80L1082 46"><animate attributeName="stroke-dashoffset" values="0;72" dur="3s" repeatCount="indefinite"/></path>
  </g>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" text-anchor="middle">
    <g transform="translate(600 80)">
      <circle r="38" fill="#0B1630" stroke="#22D3EE" stroke-width="2"/>
      <circle r="46" stroke="#22D3EE" stroke-opacity=".35"><animate attributeName="r" values="39;51;39" dur="2.6s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.6s" repeatCount="indefinite"/></circle>
      <text y="-2" fill="#F8FAFC" font-size="13" letter-spacing="2">BUILD</text>
      <text y="16" fill="#67E8F9" font-size="10" letter-spacing="1.5">SHIP</text>
    </g>
    <g transform="translate(118 46)"><circle r="25" fill="#16122A" stroke="#8B5CF6"/><text y="4" fill="#DDD6FE" font-size="10">AI / AGENTS</text></g>
    <g transform="translate(285 116)"><circle r="25" fill="#12172B" stroke="#A78BFA"/><text y="4" fill="#DDD6FE" font-size="10">IoT / HW</text></g>
    <g transform="translate(446 42)"><circle r="25" fill="#0C1A2A" stroke="#22D3EE"/><text y="4" fill="#A5F3FC" font-size="10">WEB / APPS</text></g>
    <g transform="translate(754 42)"><circle r="25" fill="#0C1A2A" stroke="#22D3EE"/><text y="4" fill="#A5F3FC" font-size="10">CUDA / GPU</text></g>
    <g transform="translate(915 116)"><circle r="25" fill="#0A2024" stroke="#2DD4BF"/><text y="4" fill="#99F6E4" font-size="10">DSA</text></g>
    <g transform="translate(1082 46)"><circle r="25" fill="#0A211A" stroke="#34D399"/><text y="4" fill="#A7F3D0" font-size="10">EDU / TOOLS</text></g>
  </g>

  <circle r="4" fill="#F8FAFC" filter="url(#glow)"><animateMotion dur="3.5s" repeatCount="indefinite" path="M118 46L600 80L1082 46"/></circle>
  <circle r="4" fill="#67E8F9" filter="url(#glow)"><animateMotion dur="4s" begin="-2s" repeatCount="indefinite" path="M285 116L600 80L915 116"/></circle>
</svg>
