<svg width="1200" height="130" viewBox="0 0 1200 130" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Always learning, always improving</title>
  <desc id="desc">Animated neon signal wave surrounding Umar Khan's personal motto.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="130" gradientUnits="userSpaceOnUse"><stop stop-color="#070B18"/><stop offset=".5" stop-color="#11162C"/><stop offset="1" stop-color="#07131B"/></linearGradient>
    <linearGradient id="wave" x1="50" y1="65" x2="1150" y2="65" gradientUnits="userSpaceOnUse"><stop stop-color="#8B5CF6"/><stop offset=".5" stop-color="#22D3EE"/><stop offset="1" stop-color="#34D399"/></linearGradient>
    <filter id="glow" x="-50%" y="-100%" width="200%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
  </defs>
  <rect width="1200" height="130" rx="20" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="128" rx="19" stroke="#334155" stroke-opacity=".7"/>
  <path d="M36 65H258L281 37L305 92L332 55L358 65H842L865 40L891 88L916 51L942 65H1164" stroke="url(#wave)" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round" stroke-dasharray="12 10" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-88" dur="3.2s" repeatCount="indefinite"/>
  </path>
  <rect x="382" y="31" width="436" height="68" rx="34" fill="#0B1023" stroke="#334155"/>
  <text x="600" y="61" text-anchor="middle" fill="#F8FAFC" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="15" font-weight="800" letter-spacing="3">ALWAYS LEARNING</text>
  <text x="600" y="84" text-anchor="middle" fill="#67E8F9" font-family="Inter, Segoe UI, Arial, sans-serif" font-size="12" font-weight="700" letter-spacing="4">ALWAYS IMPROVING</text>
  <circle cx="358" cy="65" r="5" fill="#A78BFA" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.5s" repeatCount="indefinite"/></circle>
  <circle cx="842" cy="65" r="5" fill="#34D399" filter="url(#glow)"><animate attributeName="r" values="4;7;4" dur="1.5s" begin=".75s" repeatCount="indefinite"/></circle>
</svg>
