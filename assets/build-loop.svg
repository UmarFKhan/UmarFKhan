<svg width="1200" height="112" viewBox="0 0 1200 112" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Umar Khan's build loop</title>
  <desc id="desc">An animated pipeline moving from idea to prototype to ship to impact and back again.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="112" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/>
      <stop offset=".5" stop-color="#10152A"/>
      <stop offset="1" stop-color="#07131B"/>
    </linearGradient>
    <linearGradient id="line" x1="110" y1="0" x2="1090" y2="0" gradientUnits="userSpaceOnUse">
      <stop stop-color="#8B5CF6"/>
      <stop offset=".5" stop-color="#22D3EE"/>
      <stop offset="1" stop-color="#34D399"/>
    </linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%">
      <feGaussianBlur stdDeviation="4" result="blur"/>
      <feMerge><feMergeNode in="blur"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>
  <rect width="1200" height="112" rx="18" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="110" rx="17" stroke="#334155" stroke-opacity=".7"/>
  <path d="M120 56H1080" stroke="#334155" stroke-width="2"/>
  <path d="M120 56H1080" stroke="url(#line)" stroke-width="3" stroke-linecap="round" stroke-dasharray="12 20" filter="url(#glow)">
    <animate attributeName="stroke-dashoffset" values="0;-64" dur="2.4s" repeatCount="indefinite"/>
  </path>

  <g font-family="Inter, Segoe UI, Arial, sans-serif" font-weight="700" font-size="13" text-anchor="middle">
    <g transform="translate(120 56)">
      <circle r="25" fill="#14132B" stroke="#8B5CF6" stroke-width="2"/>
      <text y="5" fill="#DDD6FE">IDEA</text>
      <circle r="30" stroke="#8B5CF6" stroke-opacity=".32"><animate attributeName="r" values="26;36;26" dur="2.2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(440 56)">
      <circle r="25" fill="#0C1A2A" stroke="#22D3EE" stroke-width="2"/>
      <text y="5" fill="#A5F3FC">BUILD</text>
      <circle r="30" stroke="#22D3EE" stroke-opacity=".32"><animate attributeName="r" values="26;36;26" dur="2.2s" begin=".55s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" begin=".55s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(760 56)">
      <circle r="25" fill="#0A2024" stroke="#2DD4BF" stroke-width="2"/>
      <text y="5" fill="#99F6E4">SHIP</text>
      <circle r="30" stroke="#2DD4BF" stroke-opacity=".32"><animate attributeName="r" values="26;36;26" dur="2.2s" begin="1.1s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" begin="1.1s" repeatCount="indefinite"/></circle>
    </g>
    <g transform="translate(1080 56)">
      <circle r="25" fill="#0A211A" stroke="#34D399" stroke-width="2"/>
      <text y="5" fill="#A7F3D0">IMPACT</text>
      <circle r="30" stroke="#34D399" stroke-opacity=".32"><animate attributeName="r" values="26;36;26" dur="2.2s" begin="1.65s" repeatCount="indefinite"/><animate attributeName="opacity" values=".7;0;.7" dur="2.2s" begin="1.65s" repeatCount="indefinite"/></circle>
    </g>
  </g>

  <circle r="5" fill="#F8FAFC" filter="url(#glow)">
    <animateMotion dur="4.2s" repeatCount="indefinite" path="M120 56H1080"/>
  </circle>
</svg>
