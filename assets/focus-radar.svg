<svg width="1200" height="220" viewBox="0 0 1200 220" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Current projects radar</title>
  <desc id="desc">Animated radar tracking Atecra, news automation, IoT power control, and MacroHub.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1200" y2="220" gradientUnits="userSpaceOnUse">
      <stop stop-color="#070B18"/><stop offset=".52" stop-color="#0B1023"/><stop offset="1" stop-color="#06171A"/>
    </linearGradient>
    <linearGradient id="beam" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#22D3EE" stop-opacity=".55"/><stop offset="1" stop-color="#22D3EE" stop-opacity="0"/></linearGradient>
    <filter id="glow" x="-100%" y="-100%" width="300%" height="300%"><feGaussianBlur stdDeviation="4" result="b"/><feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge></filter>
    <clipPath id="radarClip"><circle cx="950" cy="110" r="88"/></clipPath>
  </defs>
  <rect width="1200" height="220" rx="22" fill="url(#bg)"/>
  <rect x="1" y="1" width="1198" height="218" rx="21" stroke="#334155" stroke-opacity=".72"/>

  <g font-family="Inter, Segoe UI, Arial, sans-serif">
    <text x="70" y="69" fill="#64748B" font-size="13" font-weight="700" letter-spacing="4">CURRENTLY IN MOTION</text>
    <text x="68" y="114" fill="#F8FAFC" font-size="35" font-weight="800">Agents meet hardware.</text>
    <text x="70" y="148" fill="#A5B4FC" font-size="18">Atecra · News Automation · Power IoT · MacroHub</text>
    <text x="70" y="177" fill="#64748B" font-family="Consolas, monospace" font-size="13">status: scanning for the next useful problem_</text>
    <rect x="457" y="164" width="8" height="17" fill="#34D399"><animate attributeName="opacity" values="1;0;1" dur="1s" repeatCount="indefinite"/></rect>
  </g>

  <g>
    <circle cx="950" cy="110" r="88" stroke="#22D3EE" stroke-opacity=".3"/>
    <circle cx="950" cy="110" r="59" stroke="#22D3EE" stroke-opacity=".23"/>
    <circle cx="950" cy="110" r="30" stroke="#22D3EE" stroke-opacity=".2"/>
    <path d="M862 110H1038M950 22V198" stroke="#22D3EE" stroke-opacity=".18"/>
    <g clip-path="url(#radarClip)">
      <path d="M950 110L950 18A92 92 0 0 1 1039 87Z" fill="url(#beam)">
        <animateTransform attributeName="transform" type="rotate" from="0 950 110" to="360 950 110" dur="4s" repeatCount="indefinite"/>
      </path>
    </g>
    <circle cx="950" cy="110" r="5" fill="#22D3EE" filter="url(#glow)"/>
  </g>

  <g font-family="Consolas, monospace" font-size="10" font-weight="700">
    <g><circle cx="917" cy="63" r="5" fill="#A78BFA" filter="url(#glow)"/><text x="885" y="51" fill="#C4B5FD">ATECRA</text><circle cx="917" cy="63" r="9" stroke="#A78BFA"><animate attributeName="r" values="6;15;6" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" dur="2s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="1000" cy="74" r="5" fill="#22D3EE" filter="url(#glow)"/><text x="1007" y="64" fill="#A5F3FC">NEWS</text><circle cx="1000" cy="74" r="9" stroke="#22D3EE"><animate attributeName="r" values="6;15;6" begin=".5s" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" begin=".5s" dur="2s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="985" cy="145" r="5" fill="#34D399" filter="url(#glow)"/><text x="992" y="161" fill="#A7F3D0">POWER</text><circle cx="985" cy="145" r="9" stroke="#34D399"><animate attributeName="r" values="6;15;6" begin="1s" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" begin="1s" dur="2s" repeatCount="indefinite"/></circle></g>
    <g><circle cx="900" cy="143" r="5" fill="#2DD4BF" filter="url(#glow)"/><text x="842" y="159" fill="#99F6E4">MACROHUB</text><circle cx="900" cy="143" r="9" stroke="#2DD4BF"><animate attributeName="r" values="6;15;6" begin="1.5s" dur="2s" repeatCount="indefinite"/><animate attributeName="opacity" values=".8;0;.8" begin="1.5s" dur="2s" repeatCount="indefinite"/></circle></g>
  </g>
</svg>
